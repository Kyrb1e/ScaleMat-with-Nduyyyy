<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scale Mat – Size Comparison Game</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 10 10'%3E%3Ctext y='8.5' font-size='9'%3E📏%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Barlow+Semi+Condensed:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f3b2e;--ink:#eaf3e4;--mute:rgba(234,243,228,.62);--or:#ff6a2b;--ye:#ffd23f;--cy:#7fd1ff;--gd:#3ddc84;--rd:#ff4d5a;--panel:rgba(6,26,20,.72);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.3 "Barlow Semi Condensed","Arial Narrow",Arial,sans-serif;overflow:hidden}
#mat{position:fixed;inset:0;width:100%;height:100%}
main{position:relative;height:100%;display:flex;flex-direction:column;gap:8px;padding:10px 14px;max-width:1040px;margin:0 auto}
.hud{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.logo{font:700 20px Fredoka,sans-serif;letter-spacing:.02em;margin-right:auto;display:flex;align-items:center;gap:8px}
.logo i{width:22px;height:22px;border-radius:6px;background:var(--or);display:inline-block;box-shadow:inset -5px -5px 0 rgba(0,0,0,.18)}
.pill{display:flex;align-items:baseline;gap:8px;padding:5px 14px;border-radius:999px;background:var(--panel);border:1px solid rgba(255,255,255,.14);font-size:13px;color:var(--mute)}
.pill b{font:600 20px Fredoka,sans-serif;color:var(--ink)}
.pill.bump b{animation:pop .5s}
.snd{width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,.14);background:var(--panel);color:var(--ink);font-size:16px;cursor:pointer}
.prog{display:flex;gap:6px}.prog div{flex:1;height:7px;border-radius:9px;background:rgba(255,255,255,.12);transition:background .3s}
.prog .on{background:rgba(255,255,255,.45)}.prog .g{background:var(--gd)}.prog .y{background:var(--ye)}.prog .r{background:var(--rd)}
.wrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;container-type:size}
.stage{position:relative;width:min(100cqw,150cqh);aspect-ratio:3/2;border-radius:20px;border:2px solid rgba(234,243,228,.35);background:var(--panel);backdrop-filter:blur(10px) saturate(1.2);-webkit-backdrop-filter:blur(10px) saturate(1.2);box-shadow:0 20px 60px rgba(0,0,0,.45),inset 0 0 0 6px rgba(255,255,255,.03);overflow:hidden}
.stage.shake{animation:shake .55s}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.zoom{position:absolute;top:12px;right:12px;display:flex;flex-direction:column;gap:8px}
.zoom button{width:40px;height:40px;border-radius:12px;border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.4);color:var(--ink);font:600 22px/1 Fredoka,sans-serif;cursor:pointer}
button:focus-visible{outline:3px solid var(--ye);outline-offset:2px}
.flash{position:absolute;inset:0;pointer-events:none;opacity:0}
.flash.g{animation:fl .9s;background:radial-gradient(circle,rgba(255,210,63,.4),rgba(61,220,132,.15) 60%,transparent)}
.flash.r{animation:fl .8s;background:radial-gradient(circle,transparent 30%,rgba(255,77,90,.5))}
.res{position:absolute;left:50%;top:14px;transform:translateX(-50%);text-align:center;pointer-events:none;width:max-content;max-width:calc(100% - 130px)}
.res[hidden],.ov[hidden]{display:none}
.res .w{font:700 clamp(28px,6cqw,52px)/1 Fredoka,sans-serif;animation:pop .6s cubic-bezier(.2,1.6,.4,1);text-shadow:0 3px 0 rgba(0,0,0,.35),0 0 24px currentColor}
.res.g .w{color:var(--gd)}.res.y .w{color:var(--ye)}.res.r .w{color:var(--rd)}
.res .s{font:600 22px Fredoka,sans-serif;margin-top:4px}
.res .k{font-size:14px;color:var(--mute)}.res .k i{display:inline-block;width:10px;height:10px;border-radius:3px;margin:0 5px 0 12px}
.ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(4,18,14,.62);backdrop-filter:blur(4px);padding:12px}
.card{width:min(400px,100%);max-height:100%;overflow:auto;padding:22px;border-radius:20px;background:#0b2b21;border:2px solid rgba(234,243,228,.3);text-align:center;animation:pop .5s}
.card h2{margin:0;font:700 34px Fredoka,sans-serif}.card .st{font-size:38px;color:var(--ye);letter-spacing:6px;text-shadow:0 0 18px rgba(255,210,63,.6)}
.card p{margin:6px 0 14px;color:var(--mute)}
.card ul{list-style:none;margin:0 0 16px;padding:0;text-align:left}
.card li{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px solid rgba(255,255,255,.12)}
.btn{border:0;border-radius:14px;background:var(--or);color:#1a0a02;font:700 20px Fredoka,sans-serif;padding:13px 28px;cursor:pointer;box-shadow:0 5px 0 #b8400f,0 10px 24px rgba(255,106,43,.35);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #b8400f}.btn:disabled{opacity:.4;pointer-events:none}
footer{display:flex;align-items:stretch;gap:10px}
.cards{flex:1;display:flex;gap:10px;min-width:0}
.oc{flex:1;min-width:0;display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:14px;background:var(--panel);border:1px solid rgba(255,255,255,.14)}
.oc i{flex:none;width:14px;height:14px;border-radius:50%}
.oc b{display:block;font:600 16px Fredoka,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.oc small{color:var(--mute);font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.oc.r i{background:var(--cy)}.oc.t i{background:var(--or)}
#lock{flex:none;min-width:150px}
@media(max-width:640px){footer,.cards{flex-direction:column}.oc small{white-space:normal}.logo{font-size:17px}}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:none}15%{transform:translateX(-12px) rotate(-.6deg)}35%{transform:translateX(10px) rotate(.5deg)}55%{transform:translateX(-7px)}75%{transform:translateX(4px)}}
@keyframes fl{0%{opacity:1}100%{opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.card select{width:100%;margin:0 0 16px;padding:10px;border-radius:12px;background:#0b2b21;color:var(--ink);border:1px solid rgba(255,255,255,.25);font:600 16px Fredoka,sans-serif}
.seg{display:flex;gap:8px;justify-content:center;margin-bottom:16px}.seg button{width:56px;height:40px;border-radius:12px;border:1px solid rgba(255,255,255,.25);background:transparent;color:var(--ink);font:600 18px Fredoka,sans-serif;cursor:pointer}.seg .on{background:var(--ye);color:#1a1200;border-color:var(--ye)}

.stage.fxg{animation:zoomg .9s ease-out}.stage.fxy{animation:pulsey 1s}.stage.fxr{animation:hitr .75s}
@keyframes zoomg{0%{transform:scale(1)}20%{transform:scale(1.04);filter:brightness(1.5) saturate(1.5);box-shadow:inset 0 0 180px rgba(255,210,63,.55)}100%{transform:none;filter:none}}
@keyframes pulsey{0%,100%{box-shadow:inset 0 0 0 rgba(255,210,63,0)}35%{box-shadow:inset 0 0 130px rgba(255,200,60,.4)}}
@keyframes hitr{0%{transform:none}8%{transform:translate(-18px,7px) rotate(-.9deg);filter:saturate(2.2) contrast(1.25);box-shadow:inset 0 0 200px rgba(255,40,60,.65)}18%{transform:translate(15px,-7px) rotate(.8deg)}32%{transform:translate(-10px,4px)}50%{transform:translate(6px)}100%{transform:none;filter:none}}
@keyframes glow{50%{text-shadow:0 3px 0 rgba(0,0,0,.35),0 0 70px currentColor,0 0 14px #fff;transform:scale(1.1)}}
@keyframes wob{25%{transform:rotate(-5deg)}75%{transform:rotate(5deg)}}
@keyframes glitch{0%{transform:translate(0)}25%{transform:translate(-5px,2px);text-shadow:-4px 0 #0ff,4px 0 #f0f}50%{transform:translate(5px,-2px);text-shadow:4px 0 #0ff,-4px 0 #f0f}75%{transform:translate(-3px)}100%{transform:none}}
.res.g .w{animation:pop .6s cubic-bezier(.2,1.6,.4,1),glow 1s ease-in-out .5s 2}.res.y .w{animation:pop .6s cubic-bezier(.2,1.6,.4,1),wob .5s ease-in-out .5s 2}.res.r .w{animation:pop .4s,glitch .5s steps(3) .4s 3}
.flash.y{animation:fl .9s;background:radial-gradient(circle,rgba(255,210,63,.3),transparent 70%)}
.st{font-size:44px;letter-spacing:4px}.st i{display:inline-block;font-style:normal;animation:pop .5s cubic-bezier(.2,1.6,.4,1) both;color:#ffd23f;text-shadow:0 0 18px rgba(255,210,63,.8)}.st i.off{color:#fff;opacity:.2;text-shadow:none}
</style>
</head>
<body>
<canvas id="mat"></canvas>
<main>
<div class="hud">
<div class="logo"><i></i>Scale Mat</div>
<div class="pill">ROUND <b id="rd">1 / 5</b></div>
<div class="pill" id="scp">SCORE <b id="sc">0</b></div>
<div class="pill">BEST <b id="bs">0</b></div>
<button class="snd" id="mus" aria-label="Toggle music" title="Music">🎵</button>
<button class="snd" id="snd" aria-label="Toggle sound effects" title="Sound effects">🔊</button>
</div>
<div class="prog" id="prog"></div>
<div class="wrap"><section class="stage" id="stage">
<canvas id="cv"></canvas>
<div class="flash" id="fl"></div>
<div class="zoom"><button id="zi" aria-label="Zoom in">+</button><button id="zo" aria-label="Zoom out">−</button></div>
<div class="res" id="res" hidden></div>
<div class="ov" id="ov"></div>
</section></div>
<footer>
<div class="cards">
<div class="oc r"><i></i><div><b id="rn"></b><small id="rs"></small></div></div>
<div class="oc t"><i></i><div><b id="tn"></b><small id="ts"></small></div></div>
</div>
<button class="btn" id="lock">Lock In</button>
</footer>
</main>
<script>
const $=id=>document.getElementById(id),TAU=Math.PI*2,clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const UN=[[9.4607e15,'ly'],[1.496e11,'AU'],[1e3,'km'],[1,'m'],[.01,'cm'],[1e-3,'mm'],[1e-6,'µm'],[1e-9,'nm']];
const fmt=v=>{if(!v)return'0';const m=Math.abs(v)/100,u=UN.find(x=>m>=x[0]*.98)||UN[7],q=m/u[0];return(q>=1000?Math.round(q).toLocaleString('en'):+q.toPrecision(3))+' '+u[1]};
const circ=(p,x,y,r,ccw)=>{p.moveTo(x+r,y);p.arc(x,y,r,0,TAU,!!ccw)};
const OBJ=[];

const Q=(p,x1,y1,x2,y2,w)=>{const dx=x2-x1,dy=y2-y1,l=Math.hypot(dx,dy),nx=dy/l*w/2,ny=-dx/l*w/2;p.moveTo(x1+nx,y1+ny);p.lineTo(x2+nx,y2+ny);p.lineTo(x2-nx,y2-ny);p.lineTo(x1-nx,y1-ny);p.closePath()};
const RG=(p,x,y,r,w)=>{circ(p,x,y,r);circ(p,x,y,r-w,1)};
const TPL={
quad:()=>{const p=new Path2D();E(p,100,45,58,26);E(p,150,38,24,18);E(p,172,30,20,13);E(p,178,16,5,9);[[54,60],[74,62],[122,62],[142,60]].forEach(([x,y])=>p.rect(x,y,12,100-y));Q(p,44,36,20,58,9);return[p,200,100]},
giraffe:()=>{const p=new Path2D();E(p,62,122,42,24);[28,40,76,88].forEach(x=>p.rect(x,140,8,60));Q(p,90,110,112,30,18);E(p,120,22,16,9);p.rect(114,6,3,8);p.rect(122,6,3,8);Q(p,20,110,16,150,4);return[p,136,200]},
bird:()=>{const p=new Path2D();E(p,50,90,32,42);Q(p,58,60,62,24,14);E(p,66,16,12,10);p.addPath(new Path2D('M76,14 L96,18 L76,22 Z'));Q(p,44,126,44,160,4);Q(p,58,126,58,160,4);return[p,100,162]},

tower:()=>[new Path2D('M50,0 L56,30 L70,36 L70,60 L74,60 L74,200 L26,200 L26,60 L30,60 L30,36 L44,30 Z'),100,200],
rocket:()=>{const p=new Path2D('M20,0 C28,14 32,30 32,50 L32,140 L8,140 L8,50 C8,30 12,14 20,0 Z M8,110 L8,140 L0,150 Z M32,110 L40,150 L32,140 Z');return[p,40,150]},

c:()=>{const p=new Path2D();circ(p,50,50,50);return[p,100,100]},
e:()=>{const p=new Path2D();E(p,50,30,50,30);return[p,100,60]},
r:()=>{const p=new Path2D();p.roundRect(0,0,100,60,6);return[p,100,60]},
k:()=>[new Path2D('M50,0 L100,100 L0,100 Z'),100,100],
mount:()=>[new Path2D('M0,100 L30,42 L40,50 L60,0 L100,100 Z'),100,100],
ship:()=>{const p=new Path2D('M0,40 L200,40 L180,70 L20,70 Z');p.rect(60,20,60,20);p.rect(90,4,20,16);return[p,200,70]},
bike:()=>{const p=new Path2D();RG(p,28,60,26,4);RG(p,132,60,26,4);Q(p,28,60,66,60,4);Q(p,66,60,52,28,4);Q(p,52,28,104,28,4);Q(p,104,28,66,60,4);Q(p,104,28,132,60,4);Q(p,52,28,46,22,4);Q(p,104,28,100,10,4);Q(p,100,10,114,10,4);Q(p,42,22,60,22,5);return[p,160,90]}
};

const T=(d,w,h,f)=>()=>{const p=new Path2D(d);f&&f(p);return[p,w,h]},HL=(p,x,y,w,h)=>{p.moveTo(x,y);p.lineTo(x,y+h);p.lineTo(x+w,y+h);p.lineTo(x+w,y);p.closePath()};

leaf:T('M2,56C6,26 34,4 98,2C96,34 70,58 32,54L14,58Z',100,60),

hat:T('M8,46L8,34C8,10 30,4 50,4C72,4 92,12 92,34L92,38L100,38L100,46Z',100,46),

bread:T('M4,50L4,28C0,8 20,2 50,2C80,2 100,8 96,28L96,50Z',100,50),
mouse:T('M4,30C4,8 30,2 60,4C88,6 98,18 98,30C98,42 88,54 60,56C30,58 4,52 4,30Z',100,60),

bulb:T('M30,2C50,2 58,18 58,32C58,46 46,52 44,66L16,66C14,52 2,46 2,32C2,18 10,2 30,2Z M16,70L44,70L44,80L16,80Z M18,84L42,84C42,96 36,98 30,98C24,98 18,96 18,84Z',60,98),

  const f=ctx.createLinearGradient(0,0,0,o.bh);if(glow){f.addColorStop(0,rev?'rgba(255,138,76,.8)':'#ff9a55');f.addColorStop(1,rev?'rgba(255,75,43,.8)':'#ff4b2b');ctx.shadowColor='rgba(255,90,40,.5)';ctx.shadowBlur=18}else{f.addColorStop(0,'rgba(255,225,80,.55)');f.addColorStop(1,'rgba(255,190,40,.55)')}
  ctx.fillStyle=f;ctx.fill(path);if(stroke){ctx.shadowBlur=0;ctx.lineWidth=2.2/(kk*s);ctx.strokeStyle='#ffe14d';ctx.stroke(path)}ctx.restore()};
 paint(k,1);if(rev)paint(kOf(o.L),0,1);
 ctx.fillStyle='rgba(255,154,100,.95)';ctx.font='600 11px sans-serif';ctx.fillText('▸ '+o.n+' · '+cmf(guess),tx+5,gy+34);
 if(!rev){const h=hpos(),hx=clamp(h.x,20,W-20),hy=clamp(h.y,20,H-20);
  ctx.fillStyle='rgba(6,26,20,.9)';ctx.strokeStyle='#ffd23f';ctx.lineWidth=2;ctx.beginPath();ctx.roundRect(hx-16,hy-16,32,32,10);ctx.fill();ctx.stroke();
  ctx.strokeStyle='#ffd23f';ctx.lineWidth=2.2;ctx.beginPath();ctx.moveTo(hx-6,hy+6);ctx.lineTo(hx+6,hy-6);ctx.moveTo(hx+1,hy-6);ctx.lineTo(hx+6,hy-6);ctx.lineTo(hx+6,hy-1);ctx.moveTo(hx-1,hy+6);ctx.lineTo(hx-6,hy+6);ctx.lineTo(hx-6,hy+1);ctx.stroke()}
 fx();
}
function tick(){
 if(drag&&o&&!rev){const hx=px-off.x,hy=py-off.y;guess=clamp(o.dim=='w'?(hx-txp())/s:(gy-hy)/s,o.L*1e-4,o.L*1e4);if((o.dim=='w'&&px>W-56)||(o.dim=='h'&&py<70))sT=Math.max(1e-30,sT*.985)}
 const mv=Math.abs(sT/s-1)>2e-4;if(mv||drag||P.length||rings.length||dirty>0){if(mv)s*=Math.pow(sT/s,.18);else s=sT;if(dirty>0)dirty--;draw()}requestAnimationFrame(tick)
}
/* input */
const pos=e=>{const r=cv.getBoundingClientRect();px=e.clientX-r.left;py=e.clientY-r.top};
cv.addEventListener('pointerdown',e=>{if(rev||!o||!$('ov').hidden)return;pos(e);const h=hpos(),k=kOf(guess),tx=txp();
 if(Math.hypot(px-h.x,py-h.y)<30||(px>=tx-6&&px<=tx+o.bw*k*s+6&&py>=h.y-6&&py<=gy+6)){drag=true;off={x:px-h.x,y:py-h.y};cv.setPointerCapture(e.pointerId)}});
cv.addEventListener('pointermove',pos);
['pointerup','pointercancel'].forEach(n=>cv.addEventListener(n,()=>drag=false));
cv.addEventListener('wheel',e=>{e.preventDefault();sT=clamp(sT*Math.exp(-e.deltaY*.0015),1e-30,1e8)},{passive:false});
$('zi').onclick=()=>sT=clamp(sT*1.3,1e-30,1e8);$('zo').onclick=()=>sT=clamp(sT/1.3,1e-30,1e8);
/* result + effects */
const TIER=[[97,'PERFECT!','g'],[90,'AMAZING!','g'],[80,'GREAT!','g'],[60,'NOT BAD','y'],[35,'FAR OFF','r'],[0,'WAY OFF!','r']];
function play(el,cls){el.classList.remove(cls);void el.offsetWidth;el.classList.add(cls)}
function count(el,to){const t0=performance.now(),f=t=>{const p=Math.min((t-t0)/800,1);el.textContent=(to*(1-Math.pow(1-p,3))).toFixed(1);if(p<1)requestAnimationFrame(f)};requestAnimationFrame(f)}
const CC=['#ffd23f','#3ddc84','#ff5fa2','#7fd1ff','#ff6a2b','#b388ff','#fff'];
function conf(acc){const n=acc>=97?260:acc>=90?180:110,rain=k=>{for(let i=0;i<k;i++)P.push({x:Math.random()*W,y:-12-Math.random()*60,vx:(Math.random()-.5)*3,vy:1.5+Math.random()*3,g:.04,r:Math.random()*TAU,vr:(Math.random()-.5)*.35,s:7+Math.random()*9,c:CC[i%CC.length],l:2,d:.003,sh:Math.random()<.75,fl:Math.random()*6})};
 const cn=(x,a)=>{for(let i=0;i<70;i++){const an=a+(Math.random()-.5)*.9,v=10+Math.random()*12;P.push({x,y:H*.95,vx:Math.cos(an)*v,vy:-Math.sin(an)*v,g:.3,r:Math.random()*TAU,vr:(Math.random()-.5)*.4,s:6+Math.random()*8,c:CC[i%CC.length],l:2,d:.004,sh:true,fl:Math.random()*6})}};
 cn(W*.04,1.15);cn(W*.96,Math.PI-1.15);for(let b=0;b<6;b++)setTimeout(()=>rain(n/6|0),b*220);setTimeout(()=>{cn(W*.04,1.0);cn(W*.96,Math.PI-1.0)},450)}
const fxs=c=>{const e=$('stage');e.classList.remove('fxg','fxy','fxr');void e.offsetWidth;e.classList.add(c)};
function reveal(){
 rev=true;drag=false;dirty=2;duck();const acc=Math.min(guess,o.L)/Math.max(guess,o.L)*100,pts=Math.round(acc),[,word,t]=TIER.find(x=>acc>=x[0]);
 score+=pts;res.push({n:o.n,acc,t});$('sc').textContent=score;play($('scp'),'bump');prog();
 const r=$('res');r.className='res '+t;r.innerHTML=`<div class="w">${word}</div><div class="s"><b id="ac">0.0</b>% · +${pts}</div><div class="k"><i style="background:#ff8a4c"></i>You ${fmt(guess)}<i style="background:#ffd23f"></i>Actual ${fmt(o.L)}</div>`;r.hidden=false;count($('ac'),acc);
 $('ts').textContent=o.sub+' · actual size '+fmt(o.L);
 sT=fit(Math.max(guess,o.L));
 try{navigator.vibrate(t=='r'?[60,40,60]:25)}catch(e){}const fl=$('fl');fl.className='flash';void fl.offsetWidth;fl.className='flash '+(t=='r'?'r':t=='y'?'y':'g');
 const C=['#ffd23f','#3ddc84','#ff6a2b','#7fd1ff','#ff5fa2','#fff'];
 if(t=='g'){fxs('fxg');conf(acc);for(let i=0;i<(acc>=97?4:2);i++)setTimeout(()=>rings.push({x:W/2,y:H*.5,r:10,l:1,c:i%2?'#3ddc84':'#ffd23f'}),i*130);snd(acc>=97?[523,659,784,1047,1319]:[523,659,784,1047]);
  if(acc>=90){burst(W*.12,H*.9,90,C,11,13);burst(W*.88,H*.9,90,C,11,13);setTimeout(()=>burst(W/2,H*.5,acc>=97?140:70,C,12,5),260)}else burst(W/2,H*.55,80,C,10,7);
  if(acc>=97)for(let i=0;i<3;i++)setTimeout(()=>rings.push({x:W/2,y:H*.5,r:10,l:1,c:'#ffd23f'}),i*160)}
 else if(t=='y'){fxs('fxy');rings.push({x:W/2,y:H*.5,r:10,l:1,c:'#ffd23f'});snd([440,554,494]);burst(W/2,H*.55,36,['#ffd23f','#ffe98a','#fff'],7,4)}
 else{snd([220,175,131],.16,'sawtooth',.07);fxs('fxr');snd([90,70],.3,'sawtooth',.12);rings.push({x:W/2,y:H*.5,r:10,l:1,c:'#ff4d5a'});setTimeout(()=>burst(W*.5,H*.3,40,['#ff4d5a','#5b6b63'],5,-2,.4),200);burst(W/2,H*.5,50,['#ff4d5a','#8a2b34','#5b6b63','#ff8a4c'],6,2,.35)}
 $('lock').textContent=idx==N-1?'See Results':'Next Round';
}
function finish(){
 const avg=score/N,stars=avg>=95?5:avg>=85?4:avg>=70?3:avg>=50?2:avg>=25?1:0,nb=score>best;
 if(nb){best=score;try{localStorage.setItem('scalemat_best'+N,best)}catch(e){}}
 $('bs').textContent=best;$('res').hidden=true;$('lock').disabled=true;
 $('ov').innerHTML=`<div class="card"><div class="st">${[0,1,2,3,4].map(i=>`<i class="${i<stars?'':'off'}" style="animation-delay:${i*.25}s">★</i>`).join('')}</div><h2>${score} / ${N*100}</h2><p>${nb&&score>0?'New best score!':'Best: '+best} · avg accuracy ${avg.toFixed(0)}%</p><ul>${res.map(r=>`<li><span>${r.n}</span><b style="color:var(--${r.t=='g'?'gd':r.t=='y'?'ye':'rd'})">${r.acc.toFixed(0)}%</b></li>`).join('')}</ul><button class="btn" id="again">Play Again</button></div>`;
 $('ov').hidden=false;$('again').onclick=newGame;
 if(stars>=3){snd([523,659,784,1047,784,1047,1319].concat(stars>=5?[1568,2093]:[]));if(stars>=5)for(let i=0;i<4;i++)setTimeout(()=>{burst(W*Math.random(),H*.4,90,['#ffd23f','#fff','#ff5fa2','#7fd1ff'],12,6);rings.push({x:W/2,y:H*.4,r:10,l:1,c:'#ffd23f'})},i*300);burst(W*.15,H*.9,100,['#ffd23f','#3ddc84','#ff6a2b','#7fd1ff'],11,13);burst(W*.85,H*.9,100,['#ffd23f','#3ddc84','#ff6a2b','#7fd1ff'],11,13)}
}
$('lock').onclick=()=>{if(!o||!$('ov').hidden)return;if(!rev)reveal();else if(idx>=N-1)finish();else{idx++;setup()}};
addEventListener('keydown',e=>{if(!o||rev||!$('ov').hidden)return;const d={ArrowRight:1,ArrowUp:1,ArrowLeft:-1,ArrowDown:-1}[e.key];if(d){e.preventDefault();guess=clamp(guess*(1+d*(e.shiftKey?.15:.03)),o.L*1e-4,o.L*1e4);dirty=2}});
addEventListener('keydown',e=>{if(e.key=='Enter'&&document.activeElement.tagName!='BUTTON')$('lock').click()});
/* start screen */
function start(){
 $('ov').innerHTML=`<div class="card"><h2>Scale Mat</h2><p>Compare the silhouette with the reference object, then drag it to its real-world size.</p><ul><li><span>Drag the ↗ handle</span><b>resize</b></li><li><span>+ / − or scroll</span><b>zoom</b></li><li><span>${POOL.length} objects</span><b>100 pts each</b></li></ul><p style="margin:0 0 8px">Rounds</p><div class="seg" id="seg">${[5,10,20].map(n=>`<button data-n="${n}" class="${n==N?'on':''}">${n}</button>`).join('')}</div><p style="margin:0 0 8px">Category</p><select id="cat" aria-label="Category"><option value="*">All categories</option>${CATS.map(c=>`<option ${c==cat?'selected':''}>${c}</option>`).join('')}</select><button class="btn" id="go">Start Game</button></div>`;
 $('ov').hidden=false;$('lock').disabled=true;$('seg').onclick=e=>{const n=+e.target.dataset.n;if(n){N=n;[...$('seg').children].forEach(b=>b.classList.toggle('on',b==e.target))}};$('go').onclick=()=>{cat=$('cat').value;musicOn();snd([392,523]);newGame()};
 order=POOL.map((_,i)=>i);idx=0;setup();$('lock').disabled=true;
}
start();resize();requestAnimationFrame(tick);
</script>
